name: sign-hashlist

# Signs the hash list this repository publishes, so consumers can verify it came from us.
#
# Runs unattended: RunOnFlux/flux CI already pushes each new hash here, and this signs whatever that
# push produced. Nothing to approve, and no cross-repository dispatch or token needed.
#
# Deliberately NOT triggered by pull_request_target or pull_request: this repository is public and
# either would expose the signing key to a fork.

on:
  push:
    branches: [master]
    paths: ['src/hashes/hashes.js']
  workflow_dispatch:

permissions:
  contents: write

# Two runs signing at once would both read the same sequence, and one would publish over the other
# under a sequence already used.
concurrency:
  group: sign-hashlist
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sign, verify, publish -- as one step, because the push can race a publish from flux CI, and
      # recovering from that means re-syncing to origin/master and signing again from scratch: the
      # list may have gained an entry between attempts. Without the retry, a lost race leaves the
      # newest hash unsigned until the next time hashes.js changes, which could be days.
      #
      # The verification runs against the published public keys, not the signing key. A mangled
      # secret produces a well-formed document that no consumer will accept; verifying here makes
      # that a red run rather than a document that looks published and satisfies nobody.
      #
      # Commits the signed document and the provenance record only, both times, scoped to those
      # paths. The trigger above watches src/hashes/hashes.js, so this cannot retrigger itself.
      - name: Sign and publish
        env:
          HASHLIST_SIGNING_SEED_B64: ${{ secrets.HASHLIST_SIGNING_SEED_B64 }}
        run: |
          git config user.email 'runonfluxbot@gmail.com'
          git config user.name 'policy-bot'

          SIGNED=src/hashes/hashlist-signed.json
          PROVENANCE=src/hashes/provenance.json

          for attempt in 1 2 3; do
            git fetch --quiet origin master
            git reset --quiet --hard origin/master

            CHANGED=$(node scripts/sign-hashlist.js)
            if [ "$CHANGED" != "changed=true" ]; then
              echo "list unchanged, nothing to sign"
              exit 0
            fi

            node scripts/verify-hashlist.js

            git add "$SIGNED" "$PROVENANCE"
            if git diff --cached --quiet -- "$SIGNED" "$PROVENANCE"; then
              echo "nothing changed, not publishing"
              exit 0
            fi

            SEQ=$(node -p "JSON.parse(Buffer.from(require('./$SIGNED').payload_b64,'base64')).seq")
            git commit --quiet -m "Sign hash list seq $SEQ" -- "$SIGNED" "$PROVENANCE"

            if git push --quiet; then
              echo "published seq $SEQ"
              exit 0
            fi
            echo "push raced with a publish from flux CI, retrying"
          done

          echo "could not publish after 3 attempts"
          exit 1
